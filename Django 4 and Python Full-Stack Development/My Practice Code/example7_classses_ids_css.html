<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="classes_ids.css">
    <title>Document</title>
</head>
<body>
    <p id="above">This is above the Div</p>
    <div class="myDivClass">
        <p>This is inside of Div</p>
    </div>
    <p id="below">This is below the Div</p>
    <p class="myDivClass">This is also below the Div</p>
    <div class="myDivClass2">
        <p>This is second Div</p>
        <div id="above">
            <p>This is nested Div</p>
        </div>
        <div id="below">
            <p>This is another in nested Div</p>
        </div>
    </div>
</body>
</html>
