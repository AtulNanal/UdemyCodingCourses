<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>      
    <link rel="stylesheet" href="bootstrap_gridsystem.css">
    <title>Document</title>
</head>
<body>
    <div class="container text-center">
        <!--Only Col class allows to place all items equispaced within the row-->
        <div class="row">
            <div class="col extra">
            1 of 2
            </div>
            <div class="col extra">
            2 of 2
            </div>
        </div>
        <div class="row">
            <div class="col extra">
            1 of 3
            </div>
            <div class="col extra">
            2 of 3
            </div>
            <div class="col extra">
            3 of 3
            </div>
        </div>
        <div class="row">
            <div class="col extra">
            1 of 5
            </div>
            <div class="col extra">
            2 of 5
            </div>
            <div class="col extra">
            3 of 5
            </div>
            <div class="col extra">
            4 of 5
            </div>
            <div class="col extra">
            5 of 5
            </div>                        
        </div> 
        <!--Below we have used col-sm-2 extra and col-sm-10 extra. So by default upto 
        small screens, it will show two divs of 2 cols and 10 cols respectively
        But as soon as we go to smaller than small screen, then these will>
        appear on different rows-->
        <div class="row">
            <div class="col-sm-2 extra">
            2/12
            </div>
            <div class="col-sm-10 extra">
            10/12
            </div>
        </div> 
        <!--Below we have used col-md-5 , col-md-3 and col-md-4. So by default 
        the upto medium screens, it will show two divs of 5, 3 and 4 cols respectively
        But as soon as we go to smaller than medium screen, then these will
        appear on different rows-->          
        <div class="row">
            <div class="col-md-5 extra">
            5/12
            </div>
            <div class="col-md-3 extra">
            3/12
            </div>
            <div class="col-md-4 extra">
            4/12
            </div>            
        </div>                    
    </div>

</body>
</html>
