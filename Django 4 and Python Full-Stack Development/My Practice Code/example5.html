<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="two.html">
        <label for="fname">First Name:</label>
        <input type="text", id="fname", name="fname"><br>
        <label for="lname">Last Name:</label>
        <input type="text", id="lname", name="lname"><br>
        <label for="email">Email:</label>
        <input type="email", id="email", name="email", placeholder="abc@xyz.com"><br>
        <label for="pw">Password:</label>
        <input type="password", id="pw", name="pw"><br>
        <p>Where are u visiting us from?</p>
        <label for="id_in">Inside USA:</label>
        <input type="radio", name="loc", id="id_in", value="in"><br>
        <label for="id_out">Outside USA</label>
        <input type="radio" name="loc" id="id_out", value="out"><br>
        <p>How was the service? Rate us.</p>
        <select name="stars" id="">
            <option value="3 Star">Great</option>
            <option value="2 Star">Ok</option>
            <option value="1 Star">Bad</option>
        </select><br><br>
        <textarea name="user_review" id="" cols="" rows=""></textarea><br><br>
        <input type="submit", value="Enter">

    </form>    
</body>
</html>
